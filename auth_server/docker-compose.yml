services:
  license_server:
    build: .
    container_name: mbam_license_server
    ports:
      - "8005:8005"
    # 관리자 토큰·서명키는 서버에만 있는 auth_server/.env 에서 읽는다(저장소·배포 파일에 넣지 않음).
    # 배포 스크립트가 서버에 .env 가 없으면 임의 값으로 만들어 준다.
    env_file:
      - .env
    environment:
      - PORT=8005
    volumes:
      - ./license.db:/app/license.db
      # 설치본 업데이트 패키지(cafe-1.0.1.zip, cafe-latest.json)를 두는 곳.
      # 마운트하지 않으면 서버에 파일을 올려도 컨테이너 안에서는 보이지 않아
      # /update/cafe/latest 가 '배포된 업데이트가 없습니다' 로만 응답한다.
      - ./updates:/app/updates
    restart: always
